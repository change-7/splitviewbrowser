name: Archive tracked DMG build
on:
  push:
    paths:
      - .github/workflows/archive-tracked-binaries.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checksum committed DMG
        run: |
          set -euo pipefail
          test -f SplitViewBrowser-Installer.dmg
          sha256sum SplitViewBrowser-Installer.dmg > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="tracked-binaries-2026-10-15"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" SplitViewBrowser-Installer.dmg SHA256SUMS.txt --clobber
          else
            gh release create "$tag" SplitViewBrowser-Installer.dmg SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "Previously tracked DMG (2026-10-15)" \
              --notes "Archives the exact DMG previously committed in the repository, not a newly compiled release. Older versioned releases remain unchanged."
          fi
      - name: Verify uploaded files against original bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p verified-download
          gh release download tracked-binaries-2026-10-15 -D verified-download \
            -p 'SplitViewBrowser-Installer.dmg' -p 'SHA256SUMS.txt'
          cmp -s SHA256SUMS.txt verified-download/SHA256SUMS.txt
          (cd verified-download && sha256sum -c SHA256SUMS.txt)
